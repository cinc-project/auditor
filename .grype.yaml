# Grype waivers for the cinc-auditor CVE scans. Grype auto-loads this file from
# the repo root (used by the security:build-scan:* CI jobs and local runs).
#
# Policy: prefer fixing or purging a finding over waiving it. Waive only findings
# that are inert (superseded at runtime) or accepted-risk, keep a one-line reason
# and a review date on each, and re-review periodically so waivers don't rot.
ignore:
  # --- Ruby 3.1.7 security backports (CVE-2026-132825 and others) ----------------
  # Ruby 3.1 is EOL, so the ten fixes from Ruby 3.3.13 and 3.3.14 have no 3.1
  # release. omnibus-software applies Debian's 3.1.7-1~deb12u2 backports of seven
  # and upstream's 3.3.13 regexp commits (config/patches/ruby/ruby-3.1-*.patch),
  # but grype matches the unchanged 3.1.7p261 version string. CVE-2026-132825 is
  # the CVE ID of GHSA-34m4. Scoped to that exact version, so a different Ruby
  # build still reports them. (reviewed 2026-11-22)
  - vulnerability: GHSA-34m4-m9fh-gqp5
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-87fm-7w84-j2px
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-3p8q-wmhx-vm2w
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-7x2q-68qv-6p8x
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-wpqw-5qxg-m68r
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-7whj-cfh7-xgm4
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-pvgc-g7gj-pv6h
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-qm4g-8pfh-6996
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-22mf-ggw7-pxfx
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: GHSA-gfj3-8wj9-qx8p
    package: { name: ruby, version: "3.1.7p261" }
  - vulnerability: CVE-2026-132825
    package: { name: ruby, version: "3.1.7p261" }
  # erb 2.2.3 and zlib 2.1.1 are frozen default gems of Ruby 3.1.7. omnibus-software
  # patches their code (ruby-3.1-erb-def-method-guard.patch, ruby-3.1-zlib-ungets-buffer.patch),
  # but the gem versions stay the same, so grype still matches them. (reviewed 2026-11-22)
  - vulnerability: GHSA-q339-8rmv-2mhv
    package: { name: erb, version: "2.2.3", type: gem }
  - vulnerability: GHSA-g857-hhfv-j68w
    package: { name: zlib, version: "2.1.1", type: gem }
  # GHSA-8474-xrp6-wh69 (activesupport safe_constantize DoS) is fixed only in
  # activesupport 8.0.5.2 and later, which needs Ruby 3.2, and train pins
  # activesupport ~> 7.2, which has no fixed release. (reviewed 2026-11-22)
  - vulnerability: GHSA-8474-xrp6-wh69
    package: { name: activesupport, version: "7.2.3.1", type: gem }
  # uri 0.12.4 is a frozen default gem of Ruby 3.1.7. omnibus-software patches its code
  # (ruby-3.1-uri-userinfo-order.patch, the 0.12.5 fix), but the gem version stays the
  # same, so grype still matches it. (reviewed 2026-11-22)
  - vulnerability: GHSA-j4pr-3wm6-xx2r
    package: { name: uri, version: "0.12.4", type: gem }
  # excon 0.112.0 (GHSA-48rx-c7pg-q66r) is fixed in 1.5.0, but k8s-ruby 0.17.2 pins excon
  # below 1.0 and inspec.gemspec caps train-kubernetes below 0.3.1, so the 5.x line cannot
  # move without changing its Kubernetes plugin. (reviewed 2026-11-22)
  - vulnerability: GHSA-48rx-c7pg-q66r
    package: { name: excon, version: "0.112.0", type: gem }
